}

/* Safari */
@-webkit-keyframes spin {
  0% { -webkit-transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>

<!--login-model-->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">UserName</label>
            <input type="text" class="form-control" id="name-input" required>
          </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label">Password</label>
            <input class="form-control" type="password" id="password-input" required></input>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary"  id="seccess"  onclick="loginuser()">Login</button>
      </div>
    </div>
  </div>
</div>
<!--login-model//-->
<!--Registe-modelr-->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Register New User</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
             <label for="recipient-name" class="col-form-label">Name</label>
            <input type="text" class="form-control" id="register-name-input" required>
            <label for="recipient-name" class="col-form-label">UserName</label>
            <input type="text" class="form-control" id="register-username-input" required>
           
          </div>
           <div class="mb-3">
             <input type="file" class="form-control" id="register-image-input" required>
           </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label">Password</label>
            <input class="form-control" type="password" id="register-password-input" required></input>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary"  id="seccess"  onclick="RegisterUser()">Register</button>
      </div>
    </div>
  </div>
</div>
<!--Register-model//-->

<!--delete-post-model//-->
<div class="modal fade" id="add-post-model" tabindex="-1"
 aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="title">add a new post</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
          
            <textarea name="" id="body"  placeholder="whats on your mind?" style="width: 100%;resize: none;"></textarea>
          </div>
          <div class="mb-3">
    
            <input class="form-control" type="file" id="img-post" required></input>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"  data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="btn"    onclick="addnewPost()">Creat</button>
        <input type="hidden" name="" id="edit-input" value="">
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="delete-post-model" tabindex="-1"
 aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="title">are you sure you deleted the post?</h1>
         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"  data-bs-dismiss="modal">No</button>
        <button type="button" class="btn btn-primary" id="btn"  onclick="suredeletePost()">Yes</button>
        <input type="hidden" name="" id="delete-input" value="">
      </div>
    </div>
  </div>
</div>
