<script>
    
     afterlogin()
     let curentpage=1;
    let lastpage=1
  window.addEventListener('scroll', () => {
  let infinitscroll=  window.innerHeight + window.pageYOffset >= document.body.scrollHeight
 
      
   if(infinitscroll && curentpage<lastpage){
      curentpage=curentpage + 1
      frindpost(false,curentpage)
      console.log(infinitscroll)
   }   
});
 frindpost()
  function frindpost(replace=true,page){
   loaderdata(show=true)
    axios.get(`https://tarmeezacademy.com/api/v1/users?page=${page}`)
        .then((response) => {
         loaderdata(show=false)
           lastpage  = response.data.meta.last_page
           
           console.log(response.data)
           let respo= response.data.data
          
          //  let selectposts =respo
          //  selectposts.forEach(post=>{
          // // console.log(post);
          //  })
          if(replace){
             document.getElementById('friends').innerHTML=""
          }
           
            for(post of respo){
                 console.log(post.profile_image)
                let friend=`
                     <li onclick="profileshow(${post.id}" class="list-group-item" >
                        <img src="${post.profile_image}" id="imgProfile" alt="" class="rounded-circle shadow" style="width: 40px; height: 40px;">
                            <span id="profilename">${post.name}</span>
                    </li>
                `
                document.getElementById('friends').innerHTML+=friend
            }
        })
    }
</script>
