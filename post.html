<script>
  afterlogin()

  const urlparams= new URLSearchParams(window.location.search)
  const id= urlparams.get("postid")
 
   function getpost(){
    axios.get(`https://tarmeezacademy.com/api/v1/posts/${id}`)
        .then((response) => {
          let data=response.data.data
           let comment=data.comments
          let author=data.author
           console.log(comment)
         let contentC=''
        
          for(userC of comment){
            
            contentC +=`
          
            <div class="shadow" style="background: white; padding: 10px; margin-top: 5px;">
              <img src="${userC.author. profile_image}" alt="" class="rounded-circle shadow" style="width: 40px; height: 40px;">
               <span>${userC.author.name}</span>
              <p> ${userC.body}</p>
       
      </div>
      
   `
  
          }
          
         let contenrpost=`
         <div class="d-flex justify-content-center ">
    <div class="col-11"  style="color: white; font-size: 30px;">
      <span>${data.author.name}</span>
      <span>
        .post
      </span>
   </div>
   </div>
           <div class="container mt-4">
   <div class="d-flex justify-content-center ">
    <div class="col-11" id="posts">

  <div class="card-header"  style="background-color: #09456d; color: white;">

     <span>${data.author.name}</span>
     <h5 style="color: rgb(83, 86, 86); margin-left: 30px; font-size: 14px;color: white;">${ data.author.created_at}</h5>

  </div>
  <div class="card-body">

     <p class="mt-3 p-1 rounded shadow" style=" background: rgb(112, 112, 109); width: fit-content;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope-open-heart-fill" viewBox="0 0 16 16">
  <path d="M8.941.435a2 2 0 0 0-1.882 0l-6 3.2A2 2 0 0 0 0 5.4v.313l4.222 2.475q.035-.087.08-.17c.665-1.3 2.362-1.917 3.698-1.25 1.336-.667 3.033-.05 3.699 1.25a3 3 0 0 1 .08.17L16 5.713V5.4a2 2 0 0 0-1.059-1.765zM0 6.873l4 2.344c-.012.542.124 1.117.416 1.694l.004.006L0 13.372v-6.5Zm.059 7.611 4.9-2.723c.563.73 1.383 1.467 2.49 2.198l.551.365.551-.365c1.107-.73 1.927-1.467 2.49-2.198l4.9 2.723A2 2 0 0 1 14 16H2a2 2 0 0 1-1.941-1.516M16 13.372l-4.42-2.455.004-.006c.292-.577.428-1.152.415-1.694L16 6.873v6.5Z"/>

</svg>
       <span> <span>(${data.comments_count})</span> commentt

    <div>

        <input type="text " id="text" style="outline: none; width: 70%; " >

</div>

   getpost()
   function sendComment(){
    let commentinput=document.getElementById("text").value
    const token=JSON.parse (localStorage.getItem("token"))
     axios.post(`https://tarmeezacademy.com/api/v1/posts/${id}/comments`,
      {
        body:commentinput
      },
      {
       headers:{
          //  'Content-Type': 'multipart/form-data',
           "Authorization": `Bearer ${token}`
        }
      }
       
     )
        .then((response) => {
          console.log(response.data)
           getpost()
        })
   }
  
</script>
